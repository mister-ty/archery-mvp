# ============================================================
# stream-clipper — configuración por defecto
# Copia este archivo a ./clipper.yaml (lo hace `clipper init`)
# y ajusta lo que necesites. Todo lo no definido usa estos valores.
# ============================================================

paths:
  data_dir: data            # raíz de trabajo; subcarpetas: inbox/ work/ clips/ rejected/ published/ logs/ transcripts/

ingest:
  extensions: [".mp4", ".mkv", ".mov", ".flv", ".ts"]
  stable_check_seconds: 1.5 # espera entre dos lecturas de tamaño para no procesar archivos a medio copiar
  min_free_gb: 5            # espacio libre mínimo en disco antes de procesar

transcribe:
  engine: whisper           # whisper | sidecar  (sidecar lee <video>.transcript.json, útil para tests/imports)
  model: small              # tiny | base | small | medium | large-v3  (small = buen balance CPU/calidad)
  language: es
  device: auto              # auto | cpu | cuda
  compute_type: auto        # auto | int8 | float16 ...
  vad: true                 # filtra silencios largos antes de transcribir

detect:
  # Pesos de cada señal en el score combinado por segundo
  weights:
    audio: 1.0              # picos de energía RMS (gritos, reacciones, hype)
    keywords: 1.2           # frases gatillo en la transcripción
    laughter: 0.9           # risas detectadas en transcript (jaja/jeje/xd...)
    wordrate: 0.4           # densidad de palabras (hablar rápido = excitación)
    marker: 3.0             # marcas manuales: máxima prioridad
  score_threshold: 1.6      # score mínimo para considerar un pico como candidato
  min_peak_separation: 12   # segundos mínimos entre picos candidatos
  min_duration: 18          # duración mínima del clip (sin contar endcard)
  max_duration: 35
  hook_max_lead: 2.0        # máx. segundos de contexto ANTES del momento pico (gancho rápido)
  max_overlap: 0.4          # candidatos que se solapan más de esto compiten: gana el de mayor score
  max_clips_per_vod: 8
  require_transcript: true  # sin transcripción NO se generan clips (evita clips sin sentido)
  # Frases gatillo (minúsculas) con peso individual
  keywords:
    "no puede ser": 1.5
    "no me lo creo": 1.5
    "qué es esto": 1.2
    "increíble": 1.2
    "hermano": 0.8
    "clip": 1.5            # "esto es clip", "clip eso"
    "modo": 0.6
    "última": 0.8
    "gané": 1.4
    "perdí": 1.0
    "wtf": 1.3
  laughter_pattern: "(?:[jh]a){2,}|(?:[jh]e){2,}|(?:ji){2,}|\\bxd+\\b|\\blol\\b|\\blmao\\b"

edit:
  width: 1080
  height: 1920
  fps: 30
  crf: 19
  preset: veryfast          # usa slow/medium para máxima calidad si el tiempo de render no importa
  audio_bitrate: 192k
  target_lufs: -14.0        # estándar plataformas short-form
  crop_x_offset: 0.0        # -1.0 (izquierda) a 1.0 (derecha) para encuadrar la facecam en el crop 9:16
  zoom:
    enabled: true
    max: 1.08               # zoom dinámico moderado al inicio (gancho)
    duration: 1.2           # segundos hasta llegar al zoom máximo
  subtitles:
    enabled: true
    words_per_line: 3
    uppercase: true
    font: DejaVu Sans
    font_size: 64
    outline: 4
    margin_v: 560           # px desde abajo (zona segura TikTok: ni UI inferior ni caption)
    primary_color: FFFFFF   # RRGGBB
    outline_color: "000000"
  progress_bar:
    enabled: true
    height: 12
    color: 53FC18           # verde KICK
  endcard:
    enabled: true
    duration: 1.6
    bg_color: 0F0F0F
    text: "EN VIVO EN KICK"
    subtext: "kick.com/{channel}"

metadata:
  kick_channel: "micanal"   # <-- TU canal de KICK
  title_max_len: 80
  title_templates:
    - "{hook}"
    - "{hook} 😱"
  hashtags_base: ["#clips", "#stream", "#kick", "#parati", "#fyp"]
  hashtags_extra: []        # añade los de tu juego/nicho, ej: ["#fortnite", "#gaming"]
  cta: "🔴 Directos en KICK 👉 kick.com/{channel}"

llm:
  # Mejora opcional de títulos/descripciones con LLM. "none" = solo heurísticas (gratis).
  # "ollama" usa un modelo local gratis si tienes Ollama instalado (ollama.com).
  # "anthropic" (Claude API) queda documentado para cuando haya presupuesto.
  provider: none            # none | ollama | anthropic
  model: llama3.1
  base_url: "http://localhost:11434"
